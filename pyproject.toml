[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-databricks-mlflow"
version = "0.1.0"
description = "Customer churn and spending study with dataset-shift analysis and MLflow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.24,<2", "pandas>=2,<3", "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4", "mlflow>=2.15,<4", "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
local = ["pyspark==3.5.7", "mlflow==3.5.0", "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.7.2", "matplotlib==3.10.0", "pyarrow==19.0.1", "sqlalchemy==2.0.43"]
dev = ["pytest==8.3.5", "ruff==0.11.13", "nbformat==5.10.4", "build==1.2.2.post1"]
notebooks = ["jupyterlab==4.4.3", "ipykernel==6.29.5"]

[project.scripts]
churn = "churn_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
